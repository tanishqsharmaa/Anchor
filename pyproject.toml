[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor"
version = "0.1.0"
description = "Autonomous Naval Compliance Hub for Operational Regulation"
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = { text = "MIT" }
authors = [{ name = "Naval AI Systems Team" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    "lancedb>=0.10.0",
    "tantivy>=0.22.0",
    "openvino>=2024.4.0",
    "openvino-genai>=2024.4.0",
    "nncf>=2.11.0",
    "optimum-intel[openvino]>=1.18.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "pymupdf>=1.24.0",
    "python-pptx>=1.0.0",
    "spacy>=3.7.4",
    "reportlab>=4.1.0",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ragas>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
